# Optional: run a local PostgreSQL 16 in Docker instead of a native install.
# Reads credentials from the root .env file.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mushafs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mushafs}
      POSTGRES_USER: ${DB_USER:-mushafs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - mushafs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mushafs} -d ${DB_NAME:-mushafs}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mushafs_pgdata:
