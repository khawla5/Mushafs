<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Calm abstract backdrop: soft colour fields in sage, sand and terracotta,
       fine contour lines and a faint eight-point star (khatam) lattice. -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ece1"/>
      <stop offset="0.55" stop-color="#ede3d5"/>
      <stop offset="1" stop-color="#e6dccd"/>
    </linearGradient>
    <!-- eight-point star: two overlapping squares, drawn as hairlines -->
    <pattern id="khatam" width="96" height="96" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#4e6354" stroke-width="0.8" opacity="0.07">
        <rect x="28" y="28" width="40" height="40"/>
        <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
        <circle cx="48" cy="48" r="9"/>
        <path d="M0 48 H20 M76 48 H96 M48 0 V20 M48 76 V96"/>
      </g>
    </pattern>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="patternFade"><rect width="1600" height="1000" fill="url(#fadeMask)"/></mask>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- soft colour fields -->
  <g filter="url(#blur)">
    <ellipse cx="1350" cy="120" rx="420" ry="260" fill="#9fb0a0" opacity="0.55"/>
    <ellipse cx="180" cy="900" rx="460" ry="280" fill="#c98f72" opacity="0.38"/>
    <ellipse cx="820" cy="560" rx="520" ry="240" fill="#e2c3a0" opacity="0.45"/>
    <ellipse cx="1500" cy="880" rx="380" ry="240" fill="#6f8673" opacity="0.32"/>
    <ellipse cx="120" cy="140" rx="320" ry="200" fill="#e4cdb2" opacity="0.6"/>
  </g>

  <!-- faint geometric lattice, stronger at the edges -->
  <rect width="1600" height="1000" fill="url(#khatam)" mask="url(#patternFade)"/>

  <!-- fine contour lines -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#4e6354" stroke-opacity="0.13" stroke-width="1.2">
      <path d="M-20 760 C220 700 380 740 560 700 S920 640 1120 690 S1460 720 1640 660"/>
      <path d="M-20 790 C220 732 380 770 560 732 S920 672 1120 720 S1460 752 1640 692"/>
      <path d="M-20 820 C220 764 380 800 560 764 S920 704 1120 750 S1460 784 1640 724"/>
    </g>
    <g stroke="#b0704f" stroke-opacity="0.12" stroke-width="1.2">
      <path d="M-20 250 C200 300 420 240 640 280 S1040 340 1260 290 S1520 240 1640 270"/>
      <path d="M-20 280 C200 330 420 270 640 310 S1040 370 1260 320 S1520 270 1640 300"/>
    </g>
  </g>
</svg>
